name: Rockchip ARM64 Linux Test Build

on:
  push:
    branches:
      - codex/arm64-linux-test
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  # Official Dart SDK does not work for the ARM64 Linux build.
  FLUTTER_ELINUX_VERSION: "3.16.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.9"
  RELEASE_TAG: "rockchip-linux-${{ github.sha }}"

jobs:
  generate-bridge:
    name: Generate ARM64 Linux bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Cache Bridge
        id: cache-bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-3.22.3

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.22.3"
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-rustdesk-linux-arm64:
    needs: [generate-bridge]
    name: Build RustDesk Linux ARM64
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Maximize build space
        shell: bash
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo apt-get update -y
          sudo apt-get install -y nasm

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Free Space
        run: |
          df -h
          free -m

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-unknown-linux-gnu
          components: "rustfmt"

      - name: Save Rust toolchain version
        shell: bash
        run: |
          RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')
          echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> "$GITHUB_ENV"

      - name: Disable rust bridge build
        run: |
          sed -i "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/[\"cdylib\"]/g" Cargo.toml

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          sudo apt install -y libva-dev && apt show libva-dev
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet arm64-linux \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-arm64-linux-rel-out.log" || true

      - name: Build RustDesk
        uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8 # no release tag; commit 2026-05-26
        with:
          arch: aarch64
          distro: ubuntu18.04
          githubToken: ${{ github.token }}
          setup: |
            ls -l "${PWD}"
            ls -l /opt/artifacts/vcpkg/installed
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
          shell: /bin/bash
          install: |
            apt-get update -y
            echo -e "installing deps"
            apt-get install -y \
              build-essential \
              clang \
              cmake \
              curl \
              gcc \
              git \
              g++ \
              libayatana-appindicator3-dev \
              libasound2-dev \
              libclang-10-dev \
              libgstreamer1.0-dev \
              libgstreamer-plugins-base1.0-dev \
              libgtk-3-dev \
              libpam0g-dev \
              libpulse-dev \
              libva-dev \
              libxcb-randr0-dev \
              libxcb-shape0-dev \
              libxcb-xfixes0-dev \
              libxdo-dev \
              libxfixes-dev \
              llvm-10-dev \
              nasm \
              ninja-build \
              pkg-config \
              tree \
              python3 \
              rpm \
              unzip \
              wget \
              xz-utils \
              libssl-dev
            apt-get remove -y libopus-dev || true
            ls -l ./
            tree -L 3 /opt/artifacts/vcpkg/installed
          run: |
            git config --global --add safe.directory "*"
            pushd /opt
            wget -O rust.tar.gz "https://static.rust-lang.org/dist/rust-${{ env.RUST_TOOLCHAIN_VERSION }}-aarch64-unknown-linux-gnu.tar.gz"
            tar -zxvf rust.tar.gz > /dev/null && rm rust.tar.gz
            cd "rust-${{ env.RUST_TOOLCHAIN_VERSION }}-aarch64-unknown-linux-gnu" && ./install.sh
            rm -rf "rust-${{ env.RUST_TOOLCHAIN_VERSION }}-aarch64-unknown-linux-gnu"
            mkdir -p ~/.cargo/
            echo """
              [source.crates-io]
              registry = 'https://github.com/rust-lang/crates.io-index'
            """ > ~/.cargo/config
            cat ~/.cargo/config

            pushd /workspace
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            export JOBS="--jobs 3"
            cargo build --locked --lib $JOBS --features hwcodec,flutter,unix-file-copy-paste,rockchip-linux --release
            rm -rf target/release/deps target/release/build
            rm -rf ~/.cargo

            export PATH=/opt/flutter-elinux/bin:$PATH
            popd

            pushd /opt
            wget "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz"
            tar xf "flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz"
            git clone https://github.com/sony/flutter-elinux.git || true
            pushd flutter-elinux
            git fetch
            git reset --hard "${{ env.FLUTTER_VERSION }}"
            bin/flutter-elinux doctor -v
            bin/flutter-elinux precache --linux
            popd
            cp -R flutter/bin/cache/artifacts/engine/linux-x64/shader_lib flutter-elinux/flutter/bin/cache/artifacts/engine/linux-arm64
            rm -rf flutter
            pushd flutter-elinux/flutter
            git apply "${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
            popd
            popd

            pushd /workspace
            export CARGO_INCREMENTAL=0
            export DEB_ARCH=arm64
            python3 ./build.py --flutter --skip-cargo --rockchip-linux

            echo -e "start packaging fedora package"
            sed -i "s/linux\/x64/linux\/arm64/g" ./res/rpm-flutter.spec
            HBB=$(pwd) rpmbuild ./res/rpm-flutter.spec -bb
            pushd ~/rpmbuild/RPMS/aarch64
            for name in rustdesk*??.rpm; do
              mv "$name" "/workspace/${name%%.rpm}-rockchip.rpm"
            done

            echo -e "start packaging suse package"
            popd
            pushd /workspace
            sed -i "s/linux\/x64/linux\/arm64/g" ./res/rpm-flutter-suse.spec
            HBB=$(pwd) rpmbuild ./res/rpm-flutter-suse.spec -bb
            pushd ~/rpmbuild/RPMS/aarch64
            for name in rustdesk*??.rpm; do
              mv "$name" "/workspace/${name%%.rpm}-rockchip-suse.rpm"
            done

      - name: Upload build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-rockchip-arm64-linux-${{ github.sha }}
          path: |
            rustdesk-*.deb
            rustdesk-*.rpm

      - name: Publish Rockchip ARM64 Linux test Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: RustDesk Rockchip ARM64 Linux test ${{ github.sha }}
          body: |
            Test build from `${{ github.ref_name }}`.
            Commit: `${{ github.sha }}`
          prerelease: true
          files: |
            rustdesk-*.deb
            rustdesk-*.rpm
